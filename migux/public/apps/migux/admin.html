<!doctype html>
<html>

<head>
  <title>apps/admin</title>
  <link href="../build/reset.css" rel="stylesheet" />
  <link href="../build/main.css" rel="stylesheet" />
  <link href="./admin.css" rel="stylesheet" />
</head>

<body data-migrole="app" data-migapp="admin">
  <div class="modal fade show" tabindex="-1" id="admin-modal" aria-labelledby="admin-modal-label" style="display: block"
    aria-modal="true" role="dialog">
    <div class="capture-user-clicks">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title">
              <div class="modal-title-msg">
                <h1 id="admin-modal-label">Administration Panel</h1>
              </div>
              <div class="modal-title-buttons">
                <button class="modal-close CloseButton" data-bind-disabled="disable_close" data-bind-onclick="onClose"
                  aria-label="Close"></button>
              </div>
            </div>
            <div class="modal-subtitle">
              <p class="modal-subtitle">
                TODO: Admin UI description in subtitle.
              </p>
            </div>
          </div>
          <div class="modal-body" id="admin-modal-body">
            <ul class="Tabs" data-bind-component="Tabs" data-bind-component-observe="selected_tab_index">
              <li class="TabsItem">Server Status</li>
              <li class="TabsItem">Site Stats</li>
            </ul>
            <form name="server_status" data-bind-form="DEFINED" data-bind-css="{ TabsPanel--active: $() === 0 }"
              data-bind-css-watch="selected_tab_index" class="TabsPanel" id="server_status">
              <h5>
                Server Status
              </h5>
              <div>
                <h6>
                  Grid Daemons
                  <span data-bind-onclick="serverDaemonsRequest" class="icon-button">&#x27F3;</span>
                  <small>(last updated <i data-bind-observe="server_daemons_last_updated"></i>)</small>
                </h6>
                <table class="server-daemons migux-table migux-table--striped">
                  <thead>
                    <tr>
                      <th>
                        Name
                      </th>
                      <th>
                        Status
                      </th>
                      <th>
                        PIDs
                      </th>
                    </tr>
                  </thead>
                  <tbody data-bind-observe="server_daemons"></tbody>
                </table>
                <div data-bind-observe="server_daemons_placeholder" data-bind-show="server_daemons_placeholder"></div>
                <h6>Server Logs</h6>
                <label>Last lines <input name="server_logs_last_lines" type="number" data-bind-observe="server_logs_last_lines"
                    data-bind-onenter="serverLogsRequest" /></label><span
                  data-tooltip="Fetch the N last lines of the server log. Write a value and press enter, and the logs will be fetched."
                  tabindex="0"><i>&quest;</i></span>
                <div class="server-logs">
                  <table class="migux-table migux-table--striped">
                    <thead>
                      <tr>
                        <th>
                          Timestamp
                        </th>
                        <th>
                          Level
                        </th>
                        <th>
                          Message
                        </th>
                      </tr>
                    </thead>
                    <tbody data-bind-observe="server_logs" data-bind-array="server_logs_rows" data-bind-array-each="tr">
                    </tbody>
                  </table>
                  <div data-bind-observe="server_logs_placeholder" data-bind-show="server_logs_placeholder"></div>
                </div>
              </div>
            </form>
            <form name="site_stats" data-bind-form="DEFINED" data-bind-css="{ TabsPanel--active: $() === 1 }"
              data-bind-css-watch="selected_tab_index" class="TabsPanel" id="site_stats">
              <h5>
                Site Stats
              </h5>
              <div data-bind-observe="stats"></div>
              <div data-bind-observe="stats_placeholder" data-bind-show="stats_placeholder"></div>
            </form>
          </div>
          <div class="modal-footer" id="admin-modal-footer">
            <button class="btn btn-light" data-bind-disabled="disable_close" data-bind-onclick="onClose" type="button">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
